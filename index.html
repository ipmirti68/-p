<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selcuk BeIN 1 - Mırtı v104</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>body{margin:0;background:#000;color:#fff;font-family:Arial}video{width:100%;height:100vh;background:#000}#bar{position:fixed;top:0;left:0;right:0;background:#0a1222;padding:8px;font-size:11px;display:flex;gap:6px}input{flex:1;background:#070b14;border:1px solid #33486f;color:#fff;padding:6px;border-radius:6px}button{background:#d4b78f;border:none;padding:6px 10px;border-radius:6px;font-weight:800}</style>
</head><body>
<div id="bar">
<input id="url" value="https://dga1op10s1u3lea.9e694e1c2ce7ac.click/live/selcukbeinsports1/playlist.m3u8">
<button id="play">OYNAT</button>
<button id="copy">M3U KOPYALA</button>
</div>
<video id="video" controls autoplay style="margin-top:40px"></video>
<div id="log" style="font-size:10px;padding:6px;color:#8fb0ff">Hazır - OYNAT'a bas</div>
<script>
let video=document.getElementById("video");
let log=(m)=>document.getElementById("log").textContent=m;

function playM3U8(src){
  log("Yükleniyor: "+src.slice(0,80));
  if(Hls.isSupported()){
    let hls=new Hls({
      xhrSetup:(xhr,url)=>{
        // Referer ekle - Cloudflare bypass için
        xhr.setRequestHeader('Referer','https://main.uxsyplayer6859599e6c.click/');
        xhr.setRequestHeader('Origin','https://main.uxsyplayer6859599e6c.click');
      }
    });
    hls.loadSource(src);
    hls.attachToMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{ video.play(); log("Oynatılıyor - Mırtı v104"); });
    hls.on(Hls.Events.ERROR,(e,d)=>{ log("Hata: "+d.type+" - "+d.details+" - Token ölmüş olabilir, sayfayı yenile"); });
  }else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=src; video.play();
  }
}

document.getElementById("play").onclick=()=>playM3U8(document.getElementById("url").value.trim());
document.getElementById("copy").onclick=()=>{
  let m3u=`#EXTM3U\n#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/BeIN_Sports_logo.svg/500px-BeIN_Sports_logo.svg.png" group-title="Spor",BeIN Sports 1 Selçuk\n${document.getElementById("url").value.trim()}`;
  navigator.clipboard.writeText(m3u);
  log("M3U kopyalandı - Mırtı TV > AYAR > M3U içeriğini yapıştır");
};

// Otomatik oynat
playM3U8(document.getElementById("url").value);

setTimeout(()=>{
  if(video.paused) log("VLC'de açmama sebebi: Cloudflare koruması - Mırtı player'da Referer ile denedim, olmazsa linkin domaini değişmiş. Ana sayfa https://main.uxsyplayer6859599e6c.click/index.php?id=selcukbeinsports1 'den taze m3u8 bul");
},3000);
</script>
</body></html>
