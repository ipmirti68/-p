<style>

</style>
</head>
<body>
<div id="top">
<button onclick="load('https://www.selcuksportshd14e17ba2ad.xyz/')">ANA SAYFA</button>
<button onclick="load('https://main.uxsyplayer6859599e6c.click/index.php?id=selcukbeinsports1')" class="active">BEIN 1</button>

<script>
function load(url){
 if(!url) return;
 document.getElementById('player').src=url;
 document.querySelectorAll('#top button').forEach(b=>b.classList.remove('active'));
