
name: DİZİLER 2.BAHAR K.KAR E.RÜYA H.BİLGİ S.BABA Y.HİKAYESİ


on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: mirti68-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ==========================================
      # DENO - YOUTUBE JAVASCRIPT DESTEĞİ
      # ==========================================

      - name: Deno Kur
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ==========================================
      # PYTHON PAKETLERİ
      # ==========================================

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]"
          python -m pip install requests beautifulsoup4 lxml playwright pyyaml
          playwright install chromium

      - name: Sistem Kontrol
        run: |
          python --version
          deno --version
          yt-dlp --version

      # ==========================================
      # 1 - İKİNCİ BAHAR
      # ==========================================

      - name: 1 - İKİNCİ BAHAR
        continue-on-error: true
        timeout-minutes: 20
        run: python "2bahar.py" || echo "2bahar failed"

      - name: 1 - IHLAMUR ALTINDA 
        continue-on-error: true
        timeout-minutes: 20
        run: python "ihlamur.py" || echo "2bahar failed"

      # ==========================================
      # 2 - KINALI KAR
      # ==========================================

      - name: 2 - KINALI KAR
        continue-on-error: true
        timeout-minutes: 40
        run: python kinali.py || echo "kinali failed"

      # ==========================================
      # 3 - EŞREF RÜYA
      # ==========================================

      - name: 3 - EŞREF RÜYA
        continue-on-error: true
        timeout-minutes: 30
        run: python esref.py || echo "esref failed"

      # ==========================================
      # 4 - YILAN HİKAYESİ
      # ==========================================

      - name: 4 - YILAN HİKAYESİ
        continue-on-error: true
        timeout-minutes: 30
        run: python yilan.py || echo "yilan failed"

      # ==========================================
      # 5 - HAYAT BİLGİSİ
      # ==========================================

      - name: 5 - HAYAT BİLGİSİ
        continue-on-error: true
        timeout-minutes: 30
        run: python hayat.py || echo "hayat failed"

 
      # ==========================================
      # DOSYALARI KAYDET
      # ==========================================

      - name: Dosyaları kaydet
        if: always()
        run: |
          set -e

          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"

          rm -rf __pycache__ .pytest_cache/

          echo "================================"
          echo "MIRTI68 DOSYA KONTROL"
          echo "================================"

          ls -lh *.m3u || echo "HİÇ M3U ÜRETİLMEDİ!"

          git add -f -- '*.m3u'

          git status --short

          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi

          git commit -m "MIRTI68 update $(date +'%d.%m %H:%M')"

          for i in 1 2 3 4 5; do

            echo "================================"
            echo "GITHUB GÖNDERİM DENEMESİ: $i"
            echo "================================"

            git fetch origin main

            if ! git merge --no-edit -X ours origin/main; then
              echo "Birleştirme başarısız"
              git merge --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "================================"
              echo "MIRTI68 GÜNCELLEME BAŞARILI"
              echo "================================"
              exit 0
            fi

            echo "Push başarısız, tekrar deneniyor..."
            sleep 5

          done

          echo "5 denemede gönderim başarısız!"
          exit 1
