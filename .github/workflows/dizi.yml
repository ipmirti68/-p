
name: Dizi Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: mirti68-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          pip install -U pip
          pip install -U yt-dlp requests beautifulsoup4 lxml playwright
          playwright install --with-deps chromium

      - name: 10 - LİNK
        continue-on-error: true
        run: python link.py || echo "link failed"

      - name: 11 - ATOM
        continue-on-error: true
        run: python atom.py || echo "atom failed"

      - name: 12 - FİLİM
        continue-on-error: true
        run: python filim.py || echo "filim failed"

      - name: 13 - GOLVAR
        continue-on-error: true
        run: python golvar.py || echo "golvar failed"

      - name: 14 - PRDİZİ
        continue-on-error: true
        run: python dizi.py || echo "prdizi failed"

      - name: 15 - CUDİZİ
        continue-on-error: true
        run: python dizi.p || echo "cudizi failed"

      - name: 16 - CMDİZİ
        continue-on-error: true
        run: python dizi.p || echo "cmdizi failed"

      - name: 17 - PZDİZİ
        continue-on-error: true
        run: python dizi.p || echo "pzdizi failed"

      - name: 18 - DİZİ
        continue-on-error: true
        run: python dz.py || echo "dizi failed"

      - name: Dosyaları kaydet
        if: always()
        run: |
          set -e

          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"

          rm -rf __pycache__ .pytest_cache/

          echo "================================"
          echo "MIRTI68 DOSYA KONTROL"
          echo "================================"

          ls -lh *.m3u >/dev/null || true

          git add -f -- '*.m3u' 

          git status --short

          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi

          git commit -m "MIRTI68 update $(date +'%d.%m %H:%M')"

          for i in 1 2 3 4 5; do

            echo "================================"
            echo "GITHUB GÖNDERİM DENEMESİ: $i"
            echo "================================"

            git fetch origin main

            # Yerel olarak oluşturulan M3U/JSON değişikliklerini koru.
            # Uzak depodaki çakışmayan değişiklikleri de birleştir.
            if ! git merge --no-edit -X ours origin/main; then
              echo "Birleştirme başarısız"
              git merge --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "================================"
              echo "MIRTI68 GÜNCELLEME BAŞARILI"
              echo "================================"
              exit 0
            fi

            echo "Push başarısız, tekrar deneniyor..."
            sleep 5

          done

          echo "5 denemede gönderim başarısız!"
          exit 1
