name: boss M3U Guncelleme

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ardaspor-m3u
  cancel-in-progress: false

jobs:
  scrape-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Playwright ve Bagimliliklari Yukle
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Arda Scriptini Calistir
        run: |
          python boss.py

      

      - name: Degisiklikleri Git ile Gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add boss68.m3u boss2.m3u8
          git diff --cached --quiet && echo "Degisiklik yok" || git commit -m "Otomatik ArdaSpor M3U Guncellemesi [skip ci]"
          git push
