
name: atv

on:
  workflow_dispatch:

  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: mirti68-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # =================================
      # REPOSITORY
      # =================================

      - name: Depoyu indir
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # =================================
      # PYTHON
      # =================================

      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # =================================
      # DENO
      # =================================

      - name: Deno kur
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # =================================
      # TÜM PAKETLER
      # =================================

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip

          python -m pip install --upgrade --pre \
            "yt-dlp[default]" \
            requests \
            beautifulsoup4 \
            lxml \
            playwright \
            pycryptodome \
            pycryptodomex \
            pyjwt \
            streamlink

          playwright install --with-deps chromium

          echo "========== SÜRÜM KONTROLÜ =========="

          python --version
          pip --version
          yt-dlp --version
          streamlink --version
          deno --version

          echo "========== MODÜL KONTROLÜ =========="

          python -c "import requests; print('REQUESTS OK')"
          python -c "import streamlink; print('STREAMLINK OK')"
          python -c "from Crypto.Cipher import AES; print('CRYPTO AES OK')"
          python -c "from bs4 import BeautifulSoup; print('BS4 OK')"
          python -c "from playwright.sync_api import sync_playwright; print('PLAYWRIGHT OK')"

      # =================================
      # ATV OTOMATİK YAYIN ÇEKME
      # =================================

      - name: ATV OTOMATİK YAYIN ÇEK
        id: atv
        timeout-minutes: 5
        continue-on-error: true
        run: |
          echo "=================================="
          echo "MIRTI68 ATV 1080P YAYIN BAŞLIYOR"
          echo "=================================="

          python -u atv1.py
          SONUC=$?

          echo "ATV_EXIT_CODE=$SONUC" >> "$GITHUB_OUTPUT"

          if [ "$SONUC" -eq 0 ]; then
            echo "ATV işlemi başarılı."
          else
            echo "ATV adresi bulunamadı veya güncellenemedi."
            echo "Eski M3U kaydı korunmuş olmalı."
          fi

          exit "$SONUC"

      # =================================
      # M3U KONTROLÜ
      # =================================

      - name: ATV M3U kontrolü
        if: always()
        run: |
          echo "========== M3U KONTROLÜ =========="

          if [ -f mirti68.m3u ]; then

            echo "M3U DOSYASI BULUNDU"

            echo "========== ATV KAYDI =========="

            grep -n -A4 -B1 'tvg-id="atv.tr"' mirti68.m3u || true

            echo "========== ATV ADRES KONTROLÜ =========="

            grep -n 'trkvz.daioncdn.net/atv/' mirti68.m3u || true

            echo "========== DOSYA BOYUTU =========="

            ls -lh mirti68.m3u

          else

            echo "M3U DOSYASI BULUNAMADI"

          fi

      # =================================
      # DOSYALARI KAYDET
      # =================================

      - name: M3U ve JSON dosyalarını kaydet
        if: always()
        run: |

          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"

          rm -rf __pycache__ .pytest_cache/

          echo "========== DOSYA KONTROLÜ =========="

          ls -lh *.m3u *.json 2>/dev/null || true

          echo "========== GIT DURUMU =========="

          git status --short

          git add -f -- '*.m3u' '*.json' 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi

          git commit -m "MIRTI68 ATV update $(date -u +'%d.%m.%Y %H:%M UTC')"

          echo "========== GITHUB PUSH =========="

          for i in 1 2 3; do

            echo "Push denemesi: $i"

            git fetch origin main

            if git rebase origin/main; then

              if git push origin HEAD:main; then
                echo "PUSH BAŞARILI"
                exit 0
              fi

            else

              echo "Rebase başarısız."
              git rebase --abort || true

            fi

            sleep 3

          done

          echo "PUSH BAŞARISIZ"
          exit 1

      # =================================
      # SONUÇ RAPORU
      # =================================

      - name: ATV SONUÇ RAPORU
        if: always()
        run: |

          echo "=================================="
          echo "MIRTI68 ATV SONUÇ RAPORU"
          echo "=================================="

          if [ "${{ steps.atv.outputs.ATV_EXIT_CODE }}" = "0" ]; then
            echo "ATV: BAŞARILI"
          else
            echo "ATV: BAŞARISIZ / ESKİ KAYIT KORUNDU"
          fi

          echo "=================================="
