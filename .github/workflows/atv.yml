
name: atv

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: mirti68-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # =================================
      # REPOSITORY
      # =================================
      - name: Depoyu indir
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # =================================
      # PYTHON
      # =================================
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # =================================
      # PLAYWRIGHT VE CHROMIUM
      # =================================
      - name: Tarayıcı paketlerini kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium

      # =================================
      # ATV YAYIN ADRESİNİ BUL
      # =================================
      - name: ATV OTOMATIK YAYIN CEK
        id: atv
        timeout-minutes: 5
        continue-on-error: true
        run: |
          echo "=================================="
          echo "MIRTI68 ATV 1080P YAYIN BASLIYOR"
          echo "=================================="

          python -u atv1.py
          SONUC=$?

          echo "ATV_EXIT_CODE=$SONUC" >> "$GITHUB_OUTPUT"

          if [ "$SONUC" -eq 0 ]; then
            echo "ATV islemi basarili."
          else
            echo "ATV adresi bulunamadi."
            echo "Eski M3U kaydi korunacak."
          fi

          exit 0

      # =================================
      # M3U KONTROLU
      # =================================
      - name: ATV M3U kontrolu
        if: always()
        run: |
          echo "========== M3U KONTROLU =========="

          if [ -f mirti68.m3u ]; then
            echo "M3U DOSYASI BULUNDU"

            echo "========== ATV KAYDI =========="
            grep -n -A4 -B1 'tvg-id="atv.tr"' mirti68.m3u || true

            echo "========== DOGRU ATV ADRESI =========="
            grep -n 'trkvz.daioncdn.net/atv/' mirti68.m3u || true

            echo "========== YANLIS AVRUPA ADRESI =========="
            grep -n 'atvavrupa' mirti68.m3u || true

            ls -lh mirti68.m3u
          else
            echo "M3U DOSYASI BULUNAMADI"
          fi

      # =================================
      # DOSYALARI KAYDET
      # =================================
      - name: M3U ve JSON dosyalarini kaydet
        if: always()
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"

          rm -rf __pycache__ .pytest_cache/

          git add -f -- '*.m3u' '*.json' 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi

          git commit -m "MIRTI68 ATV update $(date -u +'%d.%m.%Y %H:%M UTC')"

          for i in 1 2 3; do
            echo "Push denemesi: $i"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "PUSH BASARILI"
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            sleep 3
          done

          echo "PUSH BASARISIZ"
          exit 1

      # =================================
      # SONUC RAPORU
      # =================================
      - name: ATV SONUC RAPORU
        if: always()
        run: |
          echo "=================================="
          echo "MIRTI68 ATV SONUC RAPORU"
          echo "=================================="

          if [ "${{ steps.atv.outputs.ATV_EXIT_CODE }}" = "0" ]; then
            echo "ATV: BASARILI"
          else
            echo "ATV: BASARISIZ / ESKI KAYIT KORUNDU"
          fi

          echo "=================================="
