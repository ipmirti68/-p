name: MIRTI TV TEK ADRES - KATEGORILI M3U

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: mirti-tv-tek-adres
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tek listeyi olustur
        run: python tek_liste.py

      - name: GitHub'a kaydet
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"
          git add MIRTI_TV.m3u
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
            exit 0
          fi
          git commit -m "MIRTI TV tek kategorili liste guncelle"
          git pull --rebase origin main
          git push origin HEAD:main
