name: MIRTI68 HEPSI BIR ARADA

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: mirti68-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # YOUTUBE JAVASCRIPT DESTEĞİ
      - name: Deno kur
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # PAKETLER
      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre "yt-dlp[default]" requests beautifulsoup4 lxml playwright
          playwright install --with-deps chromium
          yt-dlp --version
          deno --version

      - name: 0 - AKTAR
        continue-on-error: true
        timeout-minutes: 10
        run: python aktar.py || echo "aktar failed"

      - name: 1 - IPTV ULUSAL
        continue-on-error: true
        timeout-minutes: 10
        run: python iptv.py || echo "iptv failed"
      
      - name: 2 - DİZİLER YAML
        continue-on-error: true
        timeout-minutes: 10
        run: python sdiziler.py || echo "sdiziler failed"

      - name: 3 - 7/24 YOUTUBE DİZİ 2026
        continue-on-error: true
        timeout-minutes: 10
        run: python 724y.py || echo "724y failed"

      - name: 4 - PATRO
        continue-on-error: true
        timeout-minutes: 10
        run: python patron.py || echo "patron failed"
     
      - name: 5 - MAHSUN
        continue-on-error: true
        timeout-minutes: 10
        run: python mahsun.py || echo "mahsun failed"

      - name: 6 - GOLLER
        continue-on-error: true
        timeout-minutes: 10
        run: python lig.py || echo "lig failed"

      - name: 7 - ATOM
        continue-on-error: true
        timeout-minutes: 10
        run: python atom1.py || echo "atom1 failed"
     
      - name: 8 - ALLSPOR
        continue-on-error: true
        timeout-minutes: 10
        run: python allspor.py || echo "allspor failed"
    
      # DOSYALARI KAYDET
      - name: Dosyaları kaydet
        if: always()
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"

          rm -rf __pycache__ .pytest_cache/

          git rebase --abort || true
          git fetch origin main || true

          ls -lh *.m3u *.json hatali_url_listesi.txt 2>/dev/null || true

          git add -f -- *.m3u || true
          git add -f -- *.json || true
          git add -f -- mirti68.m3u hatali_url_listesi.txt || true

          git status --short

          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi

          git commit -m "MIRTI68 update $(date +'%d.%m %H:%M')"

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push OK"
              break
            fi

            echo "Push çakıştı, tekrar deneniyor $i"
            git rebase --abort || true
            git fetch origin main

            if git rebase -X ours origin/main; then
              echo "Rebase OK, tekrar push deneniyor"
              continue
            fi

            git rebase --abort || true
            git push --force-with-lease origin HEAD:main && echo "Force push OK" && break
            sleep 3
          done
