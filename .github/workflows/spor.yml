
name: SPOR

on:
  workflow_dispatch:

  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: mirti68-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # REPOSITORY
      - name: Depoyu indir
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # PYTHON
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # DENO
      - name: Deno kur
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # PAKETLER
      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip

          python -m pip install --upgrade --pre \
            "yt-dlp[default]" \
            requests \
            beautifulsoup4 \
            lxml \
            playwright \
            pycryptodome \
            pycryptodomex \
            pyjwt

          playwright install --with-deps chromium

          echo "========== SÜRÜMLER =========="
          python --version
          yt-dlp --version
          deno --version

          python -c "import requests; print('REQUESTS OK')"
          python -c "from Crypto.Cipher import AES; print('CRYPTO AES OK')"
          python -c "from bs4 import BeautifulSoup; print('BS4 OK')"

      # ATV
      - name: ATV CANLI YAYIN GÜNCELLE
        id: atv
        timeout-minutes: 10
        run: |
          echo "========== ATV BAŞLADI =========="
          python -u atv1.py
          echo "========== ATV TAMAMLANDI =========="

      # DOSYALARI KAYDET
      - name: M3U ve JSON dosyalarını kaydet
        if: always()
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"

          rm -rf __pycache__ .pytest_cache/

          echo "========== DOSYALAR =========="
          ls -lh *.m3u *.json 2>/dev/null || true

          echo "========== GIT DURUMU =========="
          git status --short

          git add -f -- '*.m3u' '*.json' 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi

          git commit -m "MIRTI68 update $(date +'%d.%m %H:%M')"

          echo "========== PUSH =========="

          for i in 1 2 3; do

            git fetch origin main

            if git rebase -X ours origin/main; then

              if git push origin HEAD:main; then
                echo "PUSH BAŞARILI"
                exit 0
              fi

            else
              echo "Rebase başarısız."
              git rebase --abort || true
            fi

            echo "Tekrar deneniyor: $i"
            sleep 3

          done

          echo "PUSH BAŞARISIZ"
          exit 1
