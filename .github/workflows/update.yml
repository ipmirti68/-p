name: update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneler
        run: pip install requests tqdm beautifulsoup4 cloudscraper yt-dlp lxml

      - name: 1 - ULUSAL
        continue-on-error: true
        run: python iptv.py

      - name: 2 - STAR
        continue-on-error: true
        run: python star.py

      - name: 3 - SHOW
        continue-on-error: true
        run: python show.py

      - name: 4 - KANALD
        continue-on-error: true
        run: python kanald.py

      - name: 5 - DİZİ
        continue-on-error: true
        run: python dizi.py

      - name: 6 - SELCUK
        continue-on-error: true
        run: python selcuk.py

      - name: 7 - MAHSUN
        continue-on-error: true
        run: python mahsun.py

      - name: 8 - ATOM
        continue-on-error: true
        run: python atom.py

      - name: 9 - KRAL
        continue-on-error: true
        run: python kral.py

      - name: 10 - ARDA
        continue-on-error: true
        run: python arda.py

      - name: 11 - LİG
        continue-on-error: true
        run: python lig.py

      - name: Commit
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git checkout main
          git add mirti68.m3u
          git commit -m "auto update" || echo "no changes"
          git push origin main
