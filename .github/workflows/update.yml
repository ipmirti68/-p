name: update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python iptv.py
      - run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add mirti68.m3u
          git commit -m "auto update" || exit 0
          git push
