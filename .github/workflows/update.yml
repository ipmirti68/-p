name: update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: m3u-guncelleme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests tqdm beautifulsoup4 cloudscraper yt-dlp lxml pycryptodome playwright
          playwright install --with-deps chromium

      - name: Baslangic boyutu
        run: |
          echo "BASLANGIC: $(stat -c%s mirti68.m3u) byte - $(wc -l < mirti68.m3u) satir"

      - name: 1 - MAHSUN mahsun.py
        continue-on-error: true
        run: |
          python mahsun.py
          echo "SONRA mahsun.py: $(stat -c%s mirti68.m3u) byte"
          if [ $(stat -c%s mirti68.m3u) -lt 80000 ]; then echo ">>> mahsun.py SILDI!"; git checkout -- mirti68.m3u; fi

      - name: 2 - ATOM atom.py
        continue-on-error: true
        run: |
          python atom.py
          echo "SONRA atom.py: $(stat -c%s mirti68.m3u) byte"
          if [ $(stat -c%s mirti68.m3u) -lt 80000 ]; then echo ">>> atom.py SILDI!"; git checkout -- mirti68.m3u; fi

      - name: 3 - SLCK slck.py
        continue-on-error: true
        run: |
          python slck.py
          echo "SONRA slck.py: $(stat -c%s mirti68.m3u) byte"
          if [ $(stat -c%s mirti68.m3u) -lt 80000 ]; then echo ">>> slck.py SILDI!"; git checkout -- mirti68.m3u; fi

      - name: 4 - LIG lig.py
        continue-on-error: true
        run: |
          python lig.py
          echo "SONRA lig.py: $(stat -c%s mirti68.m3u) byte"
          if [ $(stat -c%s mirti68.m3u) -lt 80000 ]; then echo ">>> lig.py SILDI!"; git checkout -- mirti68.m3u; fi

      - name: 5 - ATV atv1.py
        continue-on-error: true
        run: |
          python atv1.py
          echo "SONRA atv1.py: $(stat -c%s mirti68.m3u) byte"
          if [ $(stat -c%s mirti68.m3u) -lt 80000 ]; then echo ">>> atv1.py SILDI!"; git checkout -- mirti68.m3u; fi

      - name: 6 - ALLSPOR allspor.py
        continue-on-error: true
        run: |
          python allspor.py
          echo "SONRA allspor.py: $(stat -c%s mirti68.m3u) byte"
          if [ $(stat -c%s mirti68.m3u) -lt 80000 ]; then echo ">>> allspor.py SILDI!"; git checkout -- mirti68.m3u; fi

      - name: 7 - KANALD kanald1.py
        continue-on-error: true
        run: |
          python kanald1.py
          echo "SONRA kanald1.py: $(stat -c%s mirti68.m3u) byte"
          if [ $(stat -c%s mirti68.m3u) -lt 80000 ]; then echo ">>> kanald1.py SILDI!"; git checkout -- mirti68.m3u; fi

      - name: 8 - STARTV startv1.py
        continue-on-error: true
        run: |
          python startv1.py
          echo "SONRA startv1.py: $(stat -c%s mirti68.m3u) byte"
          if [ $(stat -c%s mirti68.m3u) -lt 80000 ]; then echo ">>> startv1.py SILDI!"; git checkout -- mirti68.m3u; fi

      - name: 9 - SHOW show1.py
        continue-on-error: true
        run: |
          python show1.py
          echo "SONRA show1.py: $(stat -c%s mirti68.m3u) byte"
          if [ $(stat -c%s mirti68.m3u) -lt 80000 ]; then echo ">>> show1.py SILDI!"; git checkout -- mirti68.m3u; fi

      - name: 10 - TV8 tv81.py
        continue-on-error: true
        run: |
          python tv81.py
          echo "SONRA tv81.py: $(stat -c%s mirti68.m3u) byte"
          if [ $(stat -c%s mirti68.m3u) -lt 80000 ]; then echo ">>> tv81.py SILDI!"; git checkout -- mirti68.m3u; fi

      - name: 11 - KANAL7 kanal71.py
        continue-on-error: true
        run: |
          python kanal71.py
          echo "SONRA kanal71.py: $(stat -c%s mirti68.m3u) byte"
          if [ $(stat -c%s mirti68.m3u) -lt 80000 ]; then echo ">>> kanal71.py SILDI!"; git checkout -- mirti68.m3u; fi

      - name: 12 - NOWTV nowtv1.py
        continue-on-error: true
        run: |
          python nowtv1.py
          echo "SONRA nowtv1.py: $(stat -c%s mirti68.m3u) byte"
          if [ $(stat -c%s mirti68.m3u) -lt 80000 ]; then echo ">>> nowtv1.py SILDI!"; git checkout -- mirti68.m3u; fi

      - name: 13 - STAR ve ULUSAL tv.py
        continue-on-error: true
        run: |
          echo "ONCE tv.py: $(stat -c%s mirti68.m3u) byte"
          python tv.py
          echo "SONRA tv.py: $(stat -c%s mirti68.m3u) byte"
          if [ $(stat -c%s mirti68.m3u) -lt 80000 ]; then echo ">>> tv.py SILDI!"; git checkout -- mirti68.m3u; fi

      - name: Olusan M3U listelerini raporla
        if: always()
        run: |
          ls -lh *.m3u
          wc -l mirti68.m3u
          echo "Boyut: $(stat -c%s mirti68.m3u)"

      - name: M3U dosyalarini GitHub'a kaydet
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          SIZE=$(stat -c%s "mirti68.m3u" 2>/dev/null || echo 0)
          echo "Final boyut: $SIZE"
          if [ "$SIZE" -lt 80000 ]; then
            echo "HATA: mirti68.m3u hala kucuk ($SIZE byte), push iptal!"
            exit 1
          fi
          git add -A -- "*.m3u"
          git diff --cached --quiet && echo "Degisiklik yok" && exit 0
          git commit -m "Otomatik M3U guncelleme"
          git pull --rebase origin main || true
          git push origin HEAD:main
