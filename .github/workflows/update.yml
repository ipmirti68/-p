name: update
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"
permissions:
  contents: write
concurrency:
  group: mirti68-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Paketleri kur
        run: |
          pip install -U pip
          pip install -U yt-dlp requests beautifulsoup4 lxml playwright
          playwright install chromium --with-deps
      - name: MAHSUN
        run: python mahsun.py
      - name: GOLVAR
        run: python gol.py || echo "golvar bitti"
      - name: IPTV
        continue-on-error: true
        run: python iptv.py || echo "iptv bitti"
      - name: VOLEYBOL
        continue-on-error: true
        run: python voleybol_youtube.py || echo "voleybol bitti"
      - name: Kaydet
        if: always()
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"
          rm -rf __pycache__ .pytest_cache/
          rm -f mırtı68.m3u
          ls -lh *.m3u
          git add -f mirti68.m3u
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "update $(date +'%d.%m %H:%M')"
            for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && break; sleep 3; done
          fi
