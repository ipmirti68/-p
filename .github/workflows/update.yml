
name: update

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

  push:
    branches: [main]

permissions:
  contents: write

# Aynı anda iki Actions çalışmasını engelle
concurrency:
  group: m3u-guncelleme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests tqdm beautifulsoup4 cloudscraper yt-dlp lxml

      - name: 1 - ULUSAL
        continue-on-error: true
        run: python iptv.py

      - name: 2 - STAR
        continue-on-error: true
        run: python star.py

      - name: 3 - SHOW
        continue-on-error: true
        run: python show.py

      - name: 4 - KANALD
        continue-on-error: true
        run: python kanald.py

      - name: 5 - DIZI
        continue-on-error: true
        run: python d.py

      - name: 6 - SELCUK
        continue-on-error: true
        run: python selcuk.py

      - name: 7 - MAHSUN
        continue-on-error: true
        run: python mahsun.py

      - name: 8 - ATOM
        continue-on-error: true
        run: python atom.py

      - name: 9 - KRAL
        continue-on-error: true
        run: python kral.py

      - name: 10 - ARDA
        continue-on-error: true
        run: python arda.py

      - name: 11 - LIG
        continue-on-error: true
        run: python lig.py

      - name: 12 - ATV
        continue-on-error: true
        run: python atv.py

      - name: Olusan M3U listelerini raporla
        if: always()
        run: |
          echo "================================"
          echo "OLUSAN M3U DOSYALARI"
          echo "================================"

          find . -type f -name "*.m3u" \
            -not -path "./.git/*" \
            -printf "%p | %s byte\n" | sort

          echo "================================"
          echo "TOPLAM M3U DOSYASI"

          find . -type f -name "*.m3u" \
            -not -path "./.git/*" | wc -l

      - name: GitHub degisikliklerini al
        if: always()
        run: |
          git pull --rebase origin main

      - name: M3U dosyalarini GitHub'a kaydet
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"

          git add -A -- "*.m3u"

          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni degisiklik yok."
          else
            git commit -m "Otomatik M3U guncelleme"
            git push origin main
          fi
