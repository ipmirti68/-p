name: update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: m3u-guncelleme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests tqdm beautifulsoup4 cloudscraper yt-dlp lxml pycryptodome playwright
          playwright install --with-deps chromium

      # Kod hatalarını otomatik düzelt
      - name: Kod hatalarini duzelt
        run: |
          sed -i 's/MARKER = "# MIRTI68_ULUSAL_AUTO.*/MARKER = "# MIRTI68_ULUSAL_AUTO"/' tv.py || true
          # atv1.py icinde EPG_URL yoksa ekle
          if ! grep -q "EPG_URL =" atv1.py; then
            sed -i '1iEPG_URL = ""' atv1.py
          fi

      - name: 1 - ULUSAL
        continue-on-error: true
        run: python iptv.py

      - name: 2 - SELCUK
        continue-on-error: true
        run: python slck.py

      - name: 3 - MAHSUN
        continue-on-error: true
        run: python mahsun.py

      - name: 4 - ATOM
        continue-on-error: true
        run: python atom.py

      - name: 5 - KRAL
        continue-on-error: true
        run: python kra.py

      - name: 6 - ARDA
        continue-on-error: true
        run: python arda.py

      - name: 7 - LIG
        continue-on-error: true
        run: python lig.py
        
      - name: 8 - ATV
        continue-on-error: true
        run: python atv1.py
        
      - name: 9 - ALLSPOR
        continue-on-error: true
        run: python allspor.py

      - name: 10 - SELCUK
        continue-on-error: true
        run: python selcuk.py

      - name: 11 - PATRON
        continue-on-error: true
        run: python patron.py

      - name: 11b - PATRON 2
        continue-on-error: true
        run: python ptrn.py

      - name: 12 - STAR
        continue-on-error: true
        run: python tv.py

      - name: Olusan M3U listelerini raporla
        if: always()
        run: |
          echo "================================"
          echo "OLUSAN M3U DOSYALARI"
          echo "================================"
          find . -type f -name "*.m3u" \
            -not -path "./.git/*" \
            -printf "%p | %s byte\n" | sort
          echo "================================"
          echo "TOPLAM M3U DOSYASI"
          find . -type f -name "*.m3u" \
            -not -path "./.git/*" | wc -l

      - name: 【entity-GitHub¦canonical_name=GitHub】 son degisikliklerini al
        if: always()
        run: |
          git fetch origin main
          git stash push -u -m "M3U otomatik yedek" || true
          git rebase origin/main
          git stash pop || true

      - name: M3U dosyalarini 【entity-GitHub¦canonical_name=GitHub】'a kaydet
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add -A -- "*.m3u"
          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni degisiklik yok."
          else
            git commit -m "Otomatik M3U guncelleme"
            git push origin HEAD:main
          fi
