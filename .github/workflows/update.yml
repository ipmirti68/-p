name: Kanal Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: mirti68-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # YOUTUBE JAVASCRIPT DESTEĞİ
      - name: Deno kur
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # PAKETLER
      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre "yt-dlp[default]" requests beautifulsoup4 lxml playwright
          playwright install --with-deps chromium
          yt-dlp --version
          deno --version
          
      - name: 1 - GOLVAR
        continue-on-error: true
        run: python golvar.py || echo "golvar failed"
              
      - name: 2 - ATOM
        continue-on-error: true
        run: python atom.py || echo "atomspor failed"

      - name: 3 - 79.76.50.223/BEİN
        continue-on-error: true
        run: python bein.py || echo "dein failed"

      - name: 4 - LIG
        continue-on-error: true
        run: python lig.p || echo "lig failed"

      - name: 5 - SLCK
        continue-on-error: true
        run: python slck.p || echo "slck failed"

      - name: 6 - MAHSUN
        continue-on-error: true
        run: python mahsun.p || echo "mahsun failed"

      - name: 7 - PATRON
        continue-on-error: true
        run: python patron.p || echo "patron failed"

          
      # DOSYALARI KAYDET
      - name: Dosyaları kaydet
        if: always()
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"

          rm -rf __pycache__ .pytest_cache/

          ls -lh *.m3u *.json 2>/dev/null || true

          git add -f -- *.m3u || true
          git add -f -- *.json || true

          git status --short

          if ! git diff --cached --quiet; then
            git commit -m "MIRTI68 update $(date +'%d.%m %H:%M')"

            for i in 1 2 3; do
              if git pull --rebase --autostash origin main &&
                 git push origin HEAD:main; then
                break
              fi

              echo "Push çakıştı, tekrar deneniyor $i"
              sleep 3
            done
          else
            echo "Değişiklik yok"
          fi
