name: update
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"
permissions:
  contents: write
concurrency:
  group: mirti68-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Paketleri kur
        run: |
          pip install -U pip
          pip install -U yt-dlp requests beautifulsoup4 lxml playwright
          playwright install chromium --with-deps
      - name: 1 - ALLSPOR
        continue-on-error: true
        run: python allspor.p || echo "allspor failed"
      - name: 2 - ATV
        continue-on-error: true
        run: python atv1.p || echo "atv1 failed"
      - name: 3 - LIG
        continue-on-error: true
        run: python lig.p || echo "lig failed"
      - name: 4 - SLCK
        continue-on-error: true
        run: python slck.p || echo "slck failed"
      - name: 5 - MAHSUN
        continue-on-error: true
        run: python mahsun.p || echo "mahsun failed"
      - name: 6 - VOLEYBOL
        continue-on-error: true
        run: python voleybol_youtube.p || echo "voleybol failed"
      - name: 7 - IPTV (Ulusal)
        continue-on-error: true
        run: python iptv.py || echo "iptv failed"
      
      - name: Dosyaları kaydet
        if: always()
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"
          rm -rf __pycache__ .pytest_cache/
          rm -f mırtı68.m3u
          ls -lh *.m3u *.json 2>/dev/null || true
          git add -f *.m3u *.json
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "update $(date +'%d.%m %H:%M')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "Push çakıştı, tekrar deneniyor $i"
              sleep 3
            done
          else
            echo "Değişiklik yok"
          fi
