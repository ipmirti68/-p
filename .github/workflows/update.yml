name: liste guncelle
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bagimliliklari kur
        run: pip install requests
      - name: Linkleri guncelle
        run: python iptv.py
      - name: Push
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add mirti68.m3u
          git commit -m "fix" || exit 0
          git push
