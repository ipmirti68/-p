name: update

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: m3u-guncelleme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Depoyu indir
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      # 2. Python kurulumu
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Gerekli kütüphaneler
      - name: Kutuphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests tqdm beautifulsoup4 cloudscraper yt-dlp lxml

      # 4. ULUSAL
      - name: 1 - ULUSAL
        continue-on-error: true
        run: python iptv.py

      # 5. STAR
      - name: 2 - STAR
        continue-on-error: true
        run: python star.py

      # 6. SHOW
      - name: 3 - SHOW
        continue-on-error: true
        run: python show.py

      # 7. KANAL D
      - name: 4 - KANALD
        continue-on-error: true
        run: python kanald.py

      # 8. DIZI
      - name: 5 - DIZI
        continue-on-error: true
        run: python d.py

      # 9. SELCUK
      - name: 6 - SELCUK
        continue-on-error: true
        run: python selcuk.py

      # 10. MAHSUN
      - name: 7 - MAHSUN
        continue-on-error: true
        run: python mahsun.py

      # 11. ATOM
      - name: 8 - ATOM
        continue-on-error: true
        run: python atom.py

      # 12. KRAL
      - name: 9 - KRAL
        continue-on-error: true
        run: python kral.py

      # 13. ARDA
      - name: 10 - ARDA
        continue-on-error: true
        run: python arda.py

      # 14. LIG
      - name: 11 - LIG
        continue-on-error: true
        run: python lig.py

      # 15. ATV
      - name: 12 - ATV
        continue-on-error: true
        run: python atv.py

      # 16. M3U DOSYALARINI RAPORLA
      - name: Olusan M3U listelerini raporla
        if: always()
        run: |
          echo "================================"
          echo "OLUSAN M3U DOSYALARI"
          echo "================================"

          find . -type f -name "*.m3u" \
            -not -path "./.git/*" \
            -printf "%p | %s byte\n" | sort

          echo "================================"
          echo "TOPLAM M3U DOSYASI"

          find . -type f -name "*.m3u" \
            -not -path "./.git/*" | wc -l

      # 17. GITHUB DEGISIKLIKLERINI AL
      - name: GitHub son degisikliklerini al
        if: always()
        run: |
          git fetch origin main

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Yerel degisiklikler mevcut."
          fi

          git stash push -u -m "M3U otomatik yedek" || true
          git rebase origin/main
          git stash pop || true

      # 18. M3U DOSYALARINI KAYDET
      - name: M3U dosyalarini GitHub'a kaydet
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"

          git add -A -- "*.m3u"

          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni degisiklik yok."
          else
            git commit -m "Otomatik M3U guncelleme"

            git push origin HEAD:main
          fi
