name: update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kutuphaneler
        run: pip install requests tqdm beautifulsoup4 cloudscraper
      - name: 1 - ULUSAL
        run: python iptv.py
      - name: 2 - STAR
        run: python star.py
      - name: 3 - SHOW
        run: python show.py || echo "SHOW skip"
      - name: 4 - KANALD
        run: python kanald.py || echo "KANALD skip"
      - name: 5 - ATV
        run: python atv.py || echo "ATV skip"
      - name: Commit
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          # branch'e gec - detached HEAD fix
          git checkout main || git checkout -B main
          git add mirti68.m3u
          git commit -m "auto update ULUSAL + DIZILER" || echo "commit yok"
          git push origin main
