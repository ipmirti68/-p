name: IPTV Guncelle

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: |
          PY_FILE=$(find . -iname "*iptv.py" | head -n 1)
          echo "Bulunan: $PY_FILE"
          python "$PY_FILE"
      - run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add mirti68.m3u || git add .
          git commit -m "linkler guncellendi" || exit 0
          git push
