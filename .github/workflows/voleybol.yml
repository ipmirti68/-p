
name: MIRTI68 Voleybol Güncelleme

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          pip install requests beautifulsoup4 yt-dlp

      - name: Voleybol programını güncelle
        run: python voleybol.py

      - name: Dosyaları kaydet
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"
          git add mirti68.m3u voleybol_eski.json voleybol_program.json
          git diff --cached --quiet || (
            git commit -m "MIRTI68 Voleybol program güncelleme"
            git push
          )
