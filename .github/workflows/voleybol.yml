import os, re, json, tempfile, unicodedata
from datetime import datetime, timezone
from zoneinfo import ZoneInfo
from yt_dlp import YoutubeDL

MASTER_FILE = "mirti68.m3u"
RESULT_FILE = "voleybol_youtube.json"
CHANNEL_URL = "https://www.youtube.com/channel/UCTgQ8Bfq3AUuo1vWULdvRKw/streams"
CHANNEL_ID = "UCTgQ8Bfq3AUuo1vWULdvRKw"
GROUP_LIVE = "🏐 VOLEYBOL HLS"
GROUP_REPLAY = "🏐 SULTANLAR LİGİ TEKRAR"
OLD_GROUPS = (GROUP_LIVE, GROUP_REPLAY, "🏐 VOLEYBOL CANLI", "🏐 KUZEYBORU")
ISTANBUL = ZoneInfo("Europe/Istanbul")
MAX_VIDEOS = 20

SEED_VIDEO_URLS = ["https://www.youtube.com/watch?v=cMM1VRfJlpI"]

OPTIONS = {
    "quiet": True, "no_warnings": True, "ignoreerrors": True,
    "extract_flat": "in_playlist", "playlistend": MAX_VIDEOS,
    "skip_download": True,
    "extractor_args": {"youtube": {"player_client": ["android"]}},
}
DETAIL_OPTIONS = {
    "quiet": True, "no_warnings": True, "ignoreerrors": True,
    "skip_download": True,
    "extractor_args": {"youtube": {"player_client": ["android"]}},
}

def clean_title(v): return re.sub(r"\s+", " ", str(v or "TVF")).strip()[:250]
def normalize_text(v):
    v = str(v or "").lower().replace("ı","i")
    v = unicodedata.normalize("NFKD", v)
    return "".join(c for c in v if not unicodedata.combining(c))
def team_priority(t):
    t=normalize_text(t)
    if "kuzeyboru maxi" in t: return 0
    if "kuzeyboru" in t: return 1
    return 2
def get_video_id(value):
    if isinstance(value, dict): value=value.get("id") or ""
    m=re.search(r"(?:v=|youtu\.be/|/shorts/)([A-Za-z0-9_-]{11})", str(value))
    if m: return m.group(1)
    if re.fullmatch(r"[A-Za-z0-9_-]{11}", str(value)): return str(value)
    return ""
def get_thumbnail(info, entry, vid): return f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg" if vid else ""
def get_match_time(info, entry): return "Tarih bekleniyor"
def get_state(info, entry):
    s=(info or {}).get("live_status") or (entry or {}).get("live_status") or ""
    if s=="is_live": return "CANLI"
    if s=="is_upcoming": return "YAKLAŞAN"
    if s=="was_live": return "TAMAMLANDI"
    return "YAYIN"
def get_hls_url(info):
    for f in (info or {}).get("formats") or []:
        if not isinstance(f, dict): continue
        u=f.get("url") or ""
        if "m3u8" in u.lower(): return u
    return ""

def scan_video(ydl, vid, entry=None):
    url=f"https://www.youtube.com/watch?v={vid}"
    try: info=ydl.extract_info(url, download=False) or {}
    except: info={}
    title=clean_title(info.get("title") or (entry or {}).get("title") or vid)
    state=get_state(info, entry)
    hls=get_hls_url(info)
    if not hls:
        if state=="YAKLAŞAN":
            return {"video_id":vid,"name":title,"title":title,"youtube_url":url,"stream_url":"","thumbnail":get_thumbnail(info,entry,vid),"match_time":"YAKLAŞAN","state":state,"is_replay":False,"priority":team_priority(title)}
        return None
    is_replay=state=="TAMAMLANDI"
    print(f"{'TEKRAR' if is_replay else 'CANLI'}: {title}")
    return {"video_id":vid,"name":title,"title":title,"youtube_url":url,"stream_url":hls,"thumbnail":get_thumbnail(info,entry,vid),"match_time":state,"state":state,"is_replay":is_replay,"priority":team_priority(title)}

def scan_channel():
    print("MIRTI68 TARAMA")
    vids=[]; seen=set(); entries=[]
    for u in SEED_VIDEO_URLS:
        v=get_video_id(u)
        if v and v not in seen: seen.add(v); vids.append(v)
    try:
        with YoutubeDL(OPTIONS) as ydl:
            pl=ydl.extract_info(CHANNEL_URL, download=False)
            if pl:
                entries=pl.get("entries") or []
                for e in entries:
                    v=get_video_id(e)
                    if v and v not in seen: seen.add(v); vids.append(v)
    except Exception as e: print(f"Kanal hatası {e}")
    res=[]
    with YoutubeDL(DETAIL_OPTIONS) as ydl:
        for v in vids:
            ent=next((x for x in entries if get_video_id(x)==v), {})
            it=scan_video(ydl, v, ent)
            if it: res.append(it)
    res.sort(key=lambda x: (x["priority"], 0 if x["state"]=="CANLI" else 1))
    return res

def remove_old_groups(lines):
    out=[]
    for l in lines:
        if any(f'group-title="{g}"' in l for g in OLD_GROUPS): continue
        out.append(l)
    # URL satırını da atlamak için basit temizlik
    cleaned=[]
    skip=False
    for l in out:
        if skip and l.strip() and not l.strip().startswith("#"):
            skip=False
            continue
        if any(f'group-title="{g}"' in l for g in OLD_GROUPS):
            skip=True
            continue
        cleaned.append(l)
    return out

def atomic_write(p,c):
    fd,tp=tempfile.mkstemp(dir=".")
    try:
        with os.fdopen(fd,"w",encoding="utf-8",newline="\n") as f: f.write(c)
        os.replace(tp,p)
    except:
        if os.path.exists(tp): os.remove(tp)
        raise

def save_files(items):
    jc=json.dumps({"total":len(items),"hls_total":sum(1 for i in items if i.get("stream_url")),"matches":items}, ensure_ascii=False, indent=2)
    atomic_write(RESULT_FILE, jc)
    live=[i for i in items if i.get("stream_url") and not i.get("is_replay")]
    replay=[i for i in items if i.get("stream_url") and i.get("is_replay")]
    if os.path.isfile(MASTER_FILE):
        with open(MASTER_FILE,"r",encoding="utf-8-sig") as f: old=f.readlines()
    else: old=["#EXTM3U\n"]
    base=[l for l in old if not any(g in l for g in OLD_GROUPS)]
    if not base or "#EXTM3U" not in base[0]: base=["#EXTM3U\n"]+base
    new=list(base)
    for it in live:
        new.append(f'#EXTINF:-1 group-title="{GROUP_LIVE}",{it["name"]} | CANLI\n')
        new.append(it["stream_url"]+"\n")
    for it in replay[:10]:
        if "kuzeyboru" in normalize_text(it["name"]) or "sultanlar" in normalize_text(it["name"]):
            new.append(f'#EXTINF:-1 group-title="{GROUP_REPLAY}",{it["name"]} | TEKRAR\n')
            new.append(it["stream_url"]+"\n")
    if len(new)>1:
        atomic_write(MASTER_FILE, "".join(new))
        print(f"M3U yazildi: {len(live)} canli + {len(replay)} tekrar")
    else:
        print("HLS yok, M3U degistirilmedi")

def main():
    items=scan_channel()
    save_files(items)

if __name__=="__main__": main()
