name: MIRTI68 Voleybol Güncelleme

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Paketleri kur
        run: pip install -U yt-dlp requests beautifulsoup4 lxml

      - name: YouTube cookies hazırla
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
            chmod 600 cookies.txt
          fi

      - name: Voleybol programını güncelle
        run: python voleybol.py

      - name: YouTube tarama (Canlı + Son Hafta Tekrar)
        run: python voleybol_youtube.py

      - name: Dosyaları kaydet
        if: always()
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"
          rm -f cookies.txt
          git add -f mirti68.m3u voleybol_youtube.json voleybol_program.json
          git diff --cached --quiet || git commit -m "MIRTI68 güncellendi $(date +'%d.%m %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main
