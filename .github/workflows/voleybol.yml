
name: MIRTI68 Voleybol Güncelleme

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deno kur
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade requests beautifulsoup4
          pip install --upgrade "yt-dlp[default]" yt-dlp-ejs

      - name: Voleybol programini guncelle
        run: python voleybol.py

      - name: YouTube canli voleybol yayinlarini bul
        run: python voleybol_youtube.py

      - name: Dosyalari kaydet
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni dosya yok."
          else
            git commit -m "MIRTI68 Voleybol program guncelleme"
            git push
          fi
