name: MIRTI68 Voleybol Güncelleme
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Paketleri kur
        run: |
          pip install -U yt-dlp requests beautifulsoup4 lxml
      - name: MAHSUN M3U güncelle
        run: |
          python mahsun.py || echo "mahsun.py hatalı"
          ls -lh *.m3u *.json 2>/dev/null || true
      - name: VOLEYBOL tarama
        run: |
          python voleybol_youtube.py || echo "voleybol_youtube hatalı"
          ls -lh *.m3u *.json 2>/dev/null || true
      - name: Hepsini kaydet
        if: always()
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"
          # TÜM m3u ve json dosyalarını ekle
          git add -f *.m3u *.json 2>/dev/null || true
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "MIRTI68 + MAHSUN güncellendi $(date +'%d.%m %H:%M')"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Değişiklik yok"
          fi
