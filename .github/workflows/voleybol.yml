
name: MIRTI68 Voleybol Güncelleme

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: mirti68-voleybol
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deno kur
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade requests beautifulsoup4
          pip install --upgrade "yt-dlp[default]" yt-dlp-ejs

      - name: YouTube cookies hazirla
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > cookies.txt
            chmod 600 cookies.txt
            echo "YouTube cookies hazir."
          else
            echo "YouTube cookies tanimlanmamis."
          fi

      - name: Voleybol programini guncelle
        run: python voleybol.py

      - name: YouTube canli voleybol yayinlarini bul
        id: youtube
        continue-on-error: true
        run: python voleybol_youtube.py

      - name: Dosyalari kaydet
        if: always()
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"

          for file in mirti68.m3u voleybol_program.json voleybol_youtube.json; do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni dosya yok."
          else
            git commit -m "MIRTI68 Voleybol grubu guncellendi"
            git push
          fi

      - name: Cookies dosyasini sil
        if: always()
        run: rm -f cookies.txt

      - name: Tarama sonucunu bildir
        if: always()
        run: |
          if [ "${{ steps.youtube.outcome }}" = "success" ]; then
            echo "YouTube taramasi tamamlandi."
          else
            echo "YouTube taramasi basarisiz."
            echo "Mevcut MIRTI68 listesi korunmalidir."
          fi
