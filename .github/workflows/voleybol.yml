
name: MIRTI68 Voleybol Güncelleme

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: mirti68-voleybol
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1. Depoyu indir
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Python kur
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Deno kur
      - name: Deno kur
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 4. Paketleri kur
      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade requests beautifulsoup4
          python -m pip install --upgrade "yt-dlp[default]" yt-dlp-ejs

      # 5. yt-dlp kontrol
      - name: yt-dlp kontrol
        run: |
          python -c "import yt_dlp; print('yt-dlp başarıyla kuruldu:', yt_dlp.version.__version__)"

      # 6. YouTube cookies hazirla
      - name: YouTube cookies hazirla
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > cookies.txt
            chmod 600 cookies.txt
            echo "Cookies hazir."
          else
            echo "Cookies bulunamadi."
          fi

      # 7. Python kodlarini kontrol et
      - name: Python kodunu kontrol et
        run: |
          python -m py_compile voleybol.py
          python -m py_compile voleybol_youtube.py
          echo "Python kod kontrolu basarili."

      # 8. Voleybol programini guncelle
      - name: Voleybol programini guncelle
        run: python voleybol.py

      # 9. YouTube canli ve planli yayinlari tara
      - name: YouTube canli ve planli yayinlari tara
        id: youtube
        continue-on-error: true
        run: python voleybol_youtube.py

      # 10. Dosyalari GitHub'a kaydet
      - name: Dosyalari kaydet
        if: always()
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"

          # Cookies dosyasini Git islemlerinden once sil
          rm -f cookies.txt

          # Ana cikti dosyalarini ekle
          for file in mirti68.m3u mirti68.m3u.bak voleybol_program.json voleybol_youtube.json voleybol_youtube.json.bak; do
            if [ -f "$file" ]; then
              git add -f "$file"
              echo "Eklendi: $file"
            fi
          done

          # Diger takip edilen dosyalardaki degisiklikleri de ekle
          git add -u

          echo "Git durumu:"
          git status --short

          if ! git diff --cached --quiet; then
            git commit -m "MIRTI68 Voleybol grubu guncellendi"
          else
            echo "Kaydedilecek yeni dosya yok."
          fi

          # Uzak depodaki son degisiklikleri al
          git pull --rebase origin main

          # GitHub'a gonder
          git push origin HEAD:main

          echo "MIRTI68 GitHub guncellemesi tamamlandi."
