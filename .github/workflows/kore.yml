
name: HANIM KORE DIZILERI

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

concurrency:
  group: asyawatch-kore
  cancel-in-progress: false

jobs:
  kore-dizileri:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Kore dizilerini tara
        run: |
          python asyawatch_kore.py

      - name: M3U dosyalarını kontrol et
        run: |
          echo "Oluşturulan dosyalar:"
          ls -lh

          test -s hanim_kore_test.m3u
          test -s hanim_kore_rapor.txt

          echo "M3U ve rapor dosyaları başarıyla oluşturuldu."

      - name: M3U dosyalarını indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: HANIM-KORE-LISTESI
          path: |
            hanim_kore_test.m3u
            hanim_kore_rapor.txt
          if-no-files-found: error

    
      - name: Kore dosyalarını GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f hanim_kore_test.m3u hanim_kore_rapor.txt

          if ! git diff --cached --quiet; then
            git commit -m "Hanım Kore listesi güncellendi"
          else
            echo "Kore dosyaları zaten güncel."
          fi

          git pull --rebase origin main
          git push origin HEAD:main
