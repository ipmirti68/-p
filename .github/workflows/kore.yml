
name: PATRON OTOMATİK ÇALIŞTIR

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: patron-otomatik
  cancel-in-progress: false

jobs:
  patron:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Gerekli Kütüphaneleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4 lxml

      - name: Chromium Kur
        run: |
          playwright install --with-deps chromium

      - name: Patron.py Çalıştır
        run: |
          python patron.py

      - name: Değişiklikleri GitHub'a Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Patron otomatik güncelleme"
            git push
          else
            echo "Kaydedilecek değişiklik yok."
          fi
