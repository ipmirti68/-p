
name: İKİNCİ BAHAR DİZİLER

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  push:
    paths:
      - "2bahar.py"
      - ".github/workflows/ikinci-bahar.yml"

permissions:
  contents: write

jobs:
  ikinci-bahar:
    runs-on: ubuntu-24.04

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deno kur
        uses: denoland/setup-deno@v2

      - name: Gerekli paketler
        run: |
            python -m pip install --upgrade pip
             python -m pip install --upgrade "yt-dlp[default]" requests

      - name: İkinci Bahar kontrol
        run: python 2bahar.py

      - name: Dosyaları kaydet
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"
          git add ikinci_bahar.m3u ikinci_bahar_kontrol.json
          git diff --cached --quiet || git commit -m "İkinci Bahar HLS güncelleme"
          git push
          
