name: Dizi Ayır - Günlük Güncelle

on:
  schedule:
    - cron: "0 5 * * *"   # Her gün 05:00 Türkiye saati (UTC+3)
  workflow_dispatch:       # Elle çalıştır butonu

permissions:
  contents: write

concurrency:
  group: dizi-ayir
  cancel-in-progress: true

jobs:
  ayir:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dizileri gruplara ayır
        run: python diziayir.py --out dizi

      - name: Değişiklik var mı kontrol et
        id: degisiklik
        run: |
          git add dizi/
          if git diff --cached --quiet; then
            echo "var=false" >> $GITHUB_OUTPUT
          else
            echo "var=true" >> $GITHUB_OUTPUT
          fi

      - name: Değişikliği kaydet
        if: steps.degisiklik.outputs.var == 'true'
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "mirti68-bot@users.noreply.github.com"
          git commit -m "Dizi grupları güncellendi - $(date +'%Y-%m-%d %H:%M')"
          git push
