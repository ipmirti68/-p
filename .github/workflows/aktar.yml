name: MIRTI68 - Tek Aktar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  aktar:
    runs-on: ubuntu-latest
    steps:
      - name: Repo al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli paketler
        run: pip install requests pyyaml

      - name: Film calistir
        run: python aktarfilim.py

      - name: Film calistir
        run: python dizifilim.py

      - name: Genel calistir
        run: python aktargenel.py

      - name: Kaydet ve Push
        run: |
          # 1. .bak dosyalari push'u bozar, hepsini sil
          rm -f *.bak *.m3u.bak
          # 2. Sadece bizim 3 dosyayi al, digerlerine dokunma
          git config user.name "MIRTI68 Bot"
          git config user.email "mirti68@users.noreply.github.com"
          git add mirtitv68.m3u film.tmp.m3u genel.tmp.m3u || true
          # Degisiklik yoksa bosuna push deneme
          if git diff --cached --quiet; then
            echo "Degisiklik yok, push yok"
            exit 0
          fi
          git commit -m "Dizi + Film guncelleme" || true
          # 3. Unstaged kalmasin diye autostash ile rebase
          git pull --rebase --autostash || git pull --rebase --autostash || true
          git push || git push
