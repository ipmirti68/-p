name: MIRTI68 - DİZİ-FİLİM-SPOR-GENEL
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aktar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml

      # 1. Deneme dosyasi hazirla - ana dosyayi bozma
      - run: |
          cp mirti68.m3u mirti_test.m3u || echo "#EXTM3U" > mirti_test.m3u
          ls -lh mirti*.m3u

      # 2. Sira ile calistir, hepsi test dosyasina yazsin
      - run: HEDEF_DOSYA=mirti_test.m3u python aktardizi.py
      - run: HEDEF_DOSYA=mirti_test.m3u python aktarspor.py
      - run: HEDEF_DOSYA=mirti_test.m3u python aktarfilim.py
      - run: HEDEF_DOSYA=mirti_test.m3u python aktargenel.py

      # 3. Sonucu kontrol et
      - run: |
          echo "--- TEST DOSYASI ---"
          wc -l mirti_test.m3u mirti68.m3u
          grep -c "^#EXTINF" mirti_test.m3u || echo "0 kanal"

      # 4. Sadece test dosyasini kaydet, ana dosyaya dokunma
      - run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "mirti68@bot.local"
          git add mirti_test.m3u aktardizi.yaml aktarspor.yaml aktarfilim.yaml aktargenel.yaml
          git commit -m "Test aktarim" || echo "Degisiklik yok"
          git push
