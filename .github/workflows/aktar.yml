name: MIRTI68 - Tek Aktar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: mirti68-tek-aktar
  cancel-in-progress: false

jobs:
  aktar:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Repo al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli paketler
        run: pip install requests pyyaml

      - name: Film calistir
        run: python aktarfilim.py

      - name: Dizi calistir
        run: python aktardizi.py

      - name: Genel calistir
        run: python aktargenel.py

      - name: Spor calistir
        run: python aktarspor.py

            - name: Kaydet ve Push
        run: |
          rm -f *.bak *.m3u.bak *.tmp.m3u
          git config user.name "MIRTI68 Bot"
          git config user.email "mirti68@users.noreply.github.com"
          git add mirtitv68.m3u
          git commit -m "Guncelleme" || true
          git pull --rebase --autostash || true
          git push || git push
          git pull --rebase --autostash || true
          git push || git push
